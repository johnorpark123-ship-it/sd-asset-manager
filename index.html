<!DOCTYPE html>
<html lang="ko" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SD카드 통합 자산관리 시스템 - 스마트 대여 및 재고관리</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 h-full flex flex-col antialiased selection:bg-blue-600 selection:text-white">

    <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="bg-blue-600 text-white p-2.5 rounded-xl shadow-md flex items-center justify-center">
                    <i class="fa-solid fa-sd-card text-lg"></i>
                </div>
                <div>
                    <h1 class="font-bold text-base sm:text-lg text-slate-950 tracking-tight flex items-center space-x-2">
                        <span>SD카드 통합 자산관리 시스템</span>
                        <span class="text-xs bg-emerald-100 text-emerald-700 px-2 py-0.5 rounded-full font-medium hidden sm:inline-block">실시간 클라우드 연동</span>
                    </h1>
                    <p class="text-xs text-slate-500">전체 SD카드 목록 및 실시간 대여·반납 관리 대시보드</p>
                </div>
            </div>
            <div class="flex items-center space-x-2 sm:space-x-3">
                <button onclick="openAddModal()" class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-semibold px-3 sm:px-4 py-2 rounded-lg shadow-sm transition flex items-center space-x-2">
                    <i class="fa-solid fa-plus"></i>
                    <span class="hidden sm:inline">SD카드 등록</span>
                </button>
            </div>
        </div>
    </header>

    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 flex flex-col space-y-6">
        
        <!-- Summary Stats Grid -->
        <div class="grid grid-cols-2 lg:grid-cols-5 gap-4">
            <!-- Total Cards -->
            <div class="bg-white p-4 sm:p-5 rounded-2xl border border-slate-200 shadow-sm flex items-center justify-between">
                <div>
                    <span class="text-xs font-semibold text-slate-500 uppercase tracking-wider">전체 등록 카드</span>
                    <h2 class="text-2xl sm:text-3xl font-bold text-slate-950 mt-1" id="stat-total">-</h2>
                    <span class="text-xs text-slate-400 mt-1 block">모든 보유 수량</span>
                </div>
                <div class="w-10 h-10 sm:w-12 sm:h-12 bg-blue-50 text-blue-600 rounded-2xl flex items-center justify-center text-lg sm:text-xl shadow-inner">
                    <i class="fa-solid fa-database"></i>
                </div>
            </div>

            <!-- Available/Ready Cards -->
            <div class="bg-white p-4 sm:p-5 rounded-2xl border border-slate-200 shadow-sm flex items-center justify-between">
                <div>
                    <span class="text-xs font-semibold text-emerald-600 uppercase tracking-wider">사용 가능 / 여유</span>
                    <h2 class="text-2xl sm:text-3xl font-bold text-emerald-700 mt-1" id="stat-available">-</h2>
                    <span class="text-xs text-emerald-500 mt-1 block">즉시 대여 가능</span>
                </div>
                <div class="w-10 h-10 sm:w-12 sm:h-12 bg-emerald-50 text-emerald-600 rounded-2xl flex items-center justify-center text-lg sm:text-xl shadow-inner">
                    <i class="fa-solid fa-circle-check"></i>
                </div>
            </div>

            <!-- In Use / Borrowed Cards -->
            <div class="bg-white p-4 sm:p-5 rounded-2xl border border-slate-200 shadow-sm flex items-center justify-between">
                <div>
                    <span class="text-xs font-semibold text-amber-600 uppercase tracking-wider">대여중 / 사용중</span>
                    <h2 class="text-2xl sm:text-3xl font-bold text-amber-700 mt-1" id="stat-inuse">-</h2>
                    <span class="text-xs text-amber-500 mt-1 block">현재 출고 상태</span>
                </div>
                <div class="w-10 h-10 sm:w-12 sm:h-12 bg-amber-50 text-amber-600 rounded-2xl flex items-center justify-center text-lg sm:text-xl shadow-inner">
                    <i class="fa-solid fa-user-clock"></i>
                </div>
            </div>

            <!-- Faulty Cards -->
            <div class="bg-white p-4 sm:p-5 rounded-2xl border border-slate-200 shadow-sm flex items-center justify-between">
                <div>
                    <span class="text-xs font-semibold text-rose-600 uppercase tracking-wider">점검 필요 / 불량</span>
                    <h2 class="text-2xl sm:text-3xl font-bold text-rose-700 mt-1" id="stat-faulty">-</h2>
                    <span class="text-xs text-rose-500 mt-1 block">포맷 또는 교체 필요</span>
                </div>
                <div class="w-10 h-10 sm:w-12 sm:h-12 bg-rose-50 text-rose-600 rounded-2xl flex items-center justify-center text-lg sm:text-xl shadow-inner">
                    <i class="fa-solid fa-triangle-exclamation"></i>
                </div>
            </div>

            <!-- Lost Cards -->
            <div class="bg-white p-4 sm:p-5 rounded-2xl border border-slate-200 shadow-sm flex items-center justify-between col-span-2 lg:col-span-1">
                <div>
                    <span class="text-xs font-semibold text-purple-600 uppercase tracking-wider">분실 / 미확인</span>
                    <h2 class="text-2xl sm:text-3xl font-bold text-purple-700 mt-1" id="stat-lost">-</h2>
                    <span class="text-xs text-purple-500 mt-1 block">조치 필요 항목</span>
                </div>
                <div class="w-10 h-10 sm:w-12 sm:h-12 bg-purple-50 text-purple-600 rounded-2xl flex items-center justify-center text-lg sm:text-xl shadow-inner">
                    <i class="fa-solid fa-circle-question"></i>
                </div>
            </div>
        </div>

        <!-- Filter and Search Toolbar -->
        <div class="bg-white p-4 sm:p-5 rounded-2xl border border-slate-200 shadow-sm flex flex-col md:flex-row gap-4 items-center justify-between">
            <div class="w-full md:w-96 relative">
                <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </span>
                <input type="text" id="search-input" oninput="applyFilters()" placeholder="관리번호, 모델명, 담당자, 장착 장비 검색..." class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white transition">
            </div>

            <div class="w-full md:w-auto flex flex-wrap items-center justify-between sm:justify-start gap-2">
                <!-- Status Filter Pills -->
                <div class="inline-flex bg-slate-100 p-1 rounded-xl text-xs font-medium w-full sm:w-auto overflow-x-auto">
                    <button onclick="setStatusFilter('all')" id="filter-btn-all" class="px-3 py-1.5 rounded-lg bg-white text-slate-800 shadow-sm transition whitespace-nowrap">전체보기</button>
                    <button onclick="setStatusFilter('사용가능')" id="filter-btn-사용가능" class="px-3 py-1.5 rounded-lg text-slate-600 hover:text-slate-900 transition whitespace-nowrap">사용가능</button>
                    <button onclick="setStatusFilter('사용중')" id="filter-btn-사용중" class="px-3 py-1.5 rounded-lg text-slate-600 hover:text-slate-900 transition whitespace-nowrap">대여/사용중</button>
                    <button onclick="setStatusFilter('불량')" id="filter-btn-불량" class="px-3 py-1.5 rounded-lg text-slate-600 hover:text-slate-900 transition whitespace-nowrap">불량/점검</button>
                    <button onclick="setStatusFilter('분실')" id="filter-btn-분실" class="px-3 py-1.5 rounded-lg text-slate-600 hover:text-slate-900 transition whitespace-nowrap">분실</button>
                </div>

                <button onclick="resetFilters()" class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-600 px-3 py-2.5 rounded-xl transition flex items-center space-x-1.5">
                    <i class="fa-solid fa-rotate-left"></i>
                    <span>검색 초기화</span>
                </button>
            </div>
        </div>

        <div class="bg-white rounded-2xl border border-slate-200 shadow-sm flex-1 flex flex-col overflow-hidden">
            <div class="px-6 py-4 border-b border-slate-200 flex items-center justify-between bg-slate-50/50">
                <div class="flex items-center space-x-2">
                    <i class="fa-solid fa-list-check text-blue-600"></i>
                    <h3 class="font-semibold text-slate-800">전체 SD카드 자산 관리 목록</h3>
                    <span class="text-xs bg-slate-200 text-slate-700 px-2.5 py-0.5 rounded-full font-semibold" id="table-row-count">0개</span>
                </div>
                <div class="text-xs text-emerald-600 font-medium hidden sm:flex items-center space-x-1">
                    <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                    <span>실시간 동기화 활성화됨</span>
                </div>
            </div>

            <!-- Table Container -->
            <div id="table-container" class="flex-1 overflow-x-auto overflow-y-auto max-h-[600px]">
                <table class="w-full text-left border-collapse">
                    <thead class="bg-slate-50 sticky top-0 z-10 border-b border-slate-200 text-xs font-semibold text-slate-500 uppercase tracking-wider" id="table-head">
                        <!-- Dynamic Headers -->
                    </thead>
                    <tbody class="divide-y divide-slate-100 text-sm text-slate-700 bg-white" id="table-body">
                        <!-- Dynamic Rows -->
                    </tbody>
                </table>
            </div>
            
            <!-- Empty Search State -->
            <div id="empty-search" class="hidden p-16 text-center text-slate-500 text-sm flex flex-col items-center justify-center space-y-2">
                <i class="fa-regular fa-folder-open text-3xl text-slate-300"></i>
                <p>등록된 SD카드가 없거나 조건과 일치하는 항목이 없습니다.</p>
            </div>
        </div>
    </main>

    <!-- Action Edit Modal -->
    <div id="action-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-xl max-w-md w-full p-6 space-y-4 border border-slate-100">
            <div class="flex items-center justify-between border-b border-slate-100 pb-3">
                <h3 class="font-bold text-slate-900 text-base">SD카드 대여 / 반납 처리</h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 p-1">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>
            <form id="action-form" onsubmit="handleFormSubmit(event)" class="space-y-4">
                <input type="hidden" id="edit-row-id">
                
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">관리번호 / 모델명</label>
                    <input type="text" id="modal-item-info" readonly class="w-full bg-slate-100 border border-slate-200 rounded-xl px-3 py-2 text-sm text-slate-600 font-medium">
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">상태 선택</label>
                        <select id="modal-status" onchange="onModalStatusChange()" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                            <option value="사용가능">사용가능 (여유)</option>
                            <option value="사용중">대여중 / 사용중</option>
                            <option value="불량">불량 / 점검필요</option>
                            <option value="분실">분실</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">대여자 (담당자)</label>
                        <input type="text" id="modal-manager" placeholder="예: 홍길동" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">장착 장비</label>
                        <input type="text" id="modal-location" placeholder="예: 카메라 A" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">업데이트 날짜</label>
                        <input type="date" id="modal-date" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none cursor-pointer">
                    </div>
                </div>

                <div class="flex items-center justify-end space-x-2 pt-2">
                    <button type="button" onclick="closeModal()" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold rounded-xl transition">취소</button>
                    <button type="submit" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white text-xs font-semibold rounded-xl shadow-sm transition">저장 및 반영</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Add New Card Modal -->
    <div id="add-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-xl max-w-md w-full p-6 space-y-4 border border-slate-100">
            <div class="flex items-center justify-between border-b border-slate-100 pb-3">
                <h3 class="font-bold text-slate-900 text-base">신규 SD카드 등록</h3>
                <button onclick="closeAddModal()" class="text-slate-400 hover:text-slate-600 p-1">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>
            <form onsubmit="handleAddNewCard(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">관리번호</label>
                    <input type="text" id="add-id" required placeholder="예: SD-101" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">SD카드 모델명</label>
                    <input type="text" id="add-model" required placeholder="예: SanDisk Extreme Pro" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">용량</label>
                        <input type="text" id="add-capacity" required placeholder="예: 128GB" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">초기 상태</label>
                        <select id="add-status" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                            <option value="사용가능">사용가능</option>
                            <option value="사용중">사용중</option>
                            <option value="불량">불량</option>
                            <option value="분실">분실</option>
                        </select>
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">장착 장비</label>
                    <input type="text" id="add-location" placeholder="예: 보관함 1번" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">담당자</label>
                    <input type="text" id="add-manager" placeholder="예: 관리자" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>

                <div class="flex items-center justify-end space-x-2 pt-2">
                    <button type="button" onclick="closeAddModal()" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold rounded-xl transition">취소</button>
                    <button type="submit" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-semibold rounded-xl shadow-sm transition">등록하기</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Firebase SDK 및 연동 로직 -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // 🔥 본인의 Firebase 설정값 입력
const firebaseConfig = {
  apiKey: "AIzaSyBANvp_Se4n59yHcT9JvXyE-KN7cRIz_Go",
  authDomain: "sd-asset-manager.firebaseapp.com",
  databaseURL: "https://sd-asset-manager-default-rtdb.firebaseio.com",
  projectId: "sd-asset-manager",
  storageBucket: "sd-asset-manager.firebasestorage.app",
  messagingSenderId: "568250820087",
  appId: "1:568250820087:web:8f6dd508ec9421b1673af2",
  measurementId: "G-W8WEJ04501"
};

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let allRows = [];
        let actionHistory = [];
        const MAX_HISTORY = 100; // 이력 최대 100개 유지, 초과 시 자동 삭제
        let headers = ["관리번호", "SD카드 모델명", "용량", "상태", "장착 장비", "담당자", "업데이트 날짜"];
        let currentStatusFilter = 'all';

        const defaultData = [
            ["SD-001", "SanDisk Extreme Pro", "128GB", "사용중", "카메라 A", "김철수", "2026-06-07"],
            ["SD-002", "Samsung EVO Plus", "256GB", "사용가능", "보관함 1번", "-", "2026-06-06"],
            ["SD-003", "Lexar Professional", "64GB", "불량", "점검실", "박민수", "2026-06-05"],
            ["SD-004", "SanDisk Ultra", "128GB", "사용중", "드론 #2", "정우성", "2026-06-07"],
            ["SD-005", "Transcend High Endurance", "64GB", "사용가능", "보관함 2번", "-", "2026-06-01"],
            ["SD-006", "Sony TOUGH Specification", "128GB", "사용중", "메인 캠코더", "이지은", "2026-06-07"],
            ["SD-007", "SanDisk Extreme", "64GB", "사용가능", "보관함 1번", "-", "2026-06-04"],
            ["SD-008", "Samsung PRO Plus", "256GB", "사용중", "서브 카메라", "김철수", "2026-06-07"],
            ["SD-009", "Lexar Silver Pro", "128GB", "사용가능", "보관함 3번", "-", "2026-06-03"],
            ["SD-010", "Kingston Canvas Go!", "64GB", "분실", "미확인", "박미확인", "2026-06-02"]
        ];

        window.onload = function() {
            const dbRef = ref(db, 'sd_card_ledger');
            const historyRef = ref(db, 'sd_card_history');

            // 실시간 자산 목록 동기화
            onValue(dbRef, (snapshot) => {
                const data = snapshot.val();
                if (data !== null) {
                    // 만약 "EMPTY_STATE" 문자열이 들어있거나 배열이 아니면 실제 화면에서는 빈 리스트([])로 처리
                    if (Array.isArray(data) && data.length > 0 && data[0] !== "EMPTY_STATE") {
                        allRows = data;
                    } else {
                        allRows = [];
                    }
                } else {
                    allRows = [];
                }
                renderAll();
            });

            // 히스토리 목록 동기화
            onValue(historyRef, (snapshot) => {
                const hData = snapshot.val();
                if (hData !== null && Array.isArray(hData)) {
                    actionHistory = hData;
                }
            });
        };

        function saveToFirebase() {
            set(ref(db, 'sd_card_ledger'), allRows)
                .catch((error) => {
                    console.error("데이터 저장 실패: ", error);
                });
        }

        // 히스토리 추가 및 100개 초과 시 자동 삭제(pop) 로직
        function addHistoryLog(cardId, action, manager, date) {
            actionHistory.unshift({ cardId, action, manager, date });
            if (actionHistory.length > MAX_HISTORY) {
                actionHistory.pop(); // 가장 오래된 이력 자동 삭제
            }
            set(ref(db, 'sd_card_history'), actionHistory).catch((error) => {
                console.error("히스토리 저장 실패: ", error);
            });
        }

        function renderAll() {
            updateMetrics();
            applyFilters();
        }

        function updateMetrics() {
            const total = allRows.length;
            let available = 0;
            let inUse = 0;
            let faulty = 0;
            let lost = 0;

            allRows.forEach(row => {
                const statusVal = (row[3] || '').trim();
                if (statusVal.includes('분실') || statusVal.includes('잃어버림')) {
                    lost++;
                } else if (statusVal.includes('가능') || statusVal.includes('여유') || statusVal.includes('보관')) {
                    available++;
                } else if (statusVal.includes('사용중') || statusVal.includes('장착') || statusVal.includes('대여')) {
                    inUse++;
                } else if (statusVal.includes('불량') || statusVal.includes('고장') || statusVal.includes('점검')) {
                    faulty++;
                } else {
                    available++;
                }
            });

            document.getElementById('stat-total').innerText = total;
            document.getElementById('stat-available').innerText = available;
            document.getElementById('stat-inuse').innerText = inUse;
            document.getElementById('stat-faulty').innerText = faulty;
            document.getElementById('stat-lost').innerText = lost;
        }

        window.setStatusFilter = function(status) {
            currentStatusFilter = status;
            ['all', '사용가능', '사용중', '불량', '분실'].forEach(s => {
                const btn = document.getElementById(`filter-btn-${s}`);
                if (btn) {
                    btn.className = (s === status) 
                        ? 'px-3 py-1.5 rounded-lg bg-white text-slate-900 font-semibold shadow-sm transition whitespace-nowrap'
                        : 'px-3 py-1.5 rounded-lg text-slate-600 hover:text-slate-900 transition whitespace-nowrap';
                }
            });
            applyFilters();
        };

        window.resetFilters = function() {
            document.getElementById('search-input').value = '';
            window.setStatusFilter('all');
        };

        window.applyFilters = function() {
            const searchQuery = document.getElementById('search-input').value.toLowerCase().trim();

            const filtered = allRows.map((row, originalIndex) => ({ row, originalIndex })).filter(({ row }) => {
                const matchesSearch = !searchQuery || row.some(cell => String(cell).toLowerCase().includes(searchQuery));

                let matchesStatus = true;
                const statusVal = (row[3] || '').trim();
                
                if (currentStatusFilter !== 'all') {
                    if (currentStatusFilter === '사용가능') {
                        matchesStatus = (statusVal.includes('가능') || statusVal.includes('여유') || statusVal.includes('보관')) && !statusVal.includes('분실') && !statusVal.includes('불량');
                    } else if (currentStatusFilter === '사용중') {
                        matchesStatus = (statusVal.includes('사용중') || statusVal.includes('장착') || statusVal.includes('대여')) && !statusVal.includes('분실');
                    } else if (currentStatusFilter === '불량') {
                        matchesStatus = statusVal.includes('불량') || statusVal.includes('고장') || statusVal.includes('점검');
                    } else if (currentStatusFilter === '분실') {
                        matchesStatus = statusVal.includes('분실') || statusVal.includes('잃어버림');
                    }
                }

                return matchesSearch && matchesStatus;
            });

            renderTable(filtered);
        };

        function renderTable(filteredItems) {
            const headEl = document.getElementById('table-head');
            const bodyEl = document.getElementById('table-body');
            const emptySearch = document.getElementById('empty-search');
            const tableContainer = document.getElementById('table-container');

            headEl.innerHTML = '';
            bodyEl.innerHTML = '';

            document.getElementById('table-row-count').innerText = `${filteredItems.length}개`;

            if (filteredItems.length === 0) {
                tableContainer.classList.add('hidden');
                emptySearch.classList.remove('hidden');
                return;
            }

            tableContainer.classList.remove('hidden');
            emptySearch.classList.add('hidden');

            let headerTr = document.createElement('tr');
            headers.forEach((header) => {
                let th = document.createElement('th');
                th.className = 'px-6 py-3.5 font-semibold text-slate-600 whitespace-nowrap bg-slate-50';
                th.innerText = header;
                headerTr.appendChild(th);
            });
            let actionTh = document.createElement('th');
            actionTh.className = 'px-6 py-3.5 font-semibold text-slate-600 whitespace-nowrap bg-slate-50 text-right';
            actionTh.innerText = '대여/반납 관리';
            headerTr.appendChild(actionTh);
            headEl.appendChild(headerTr);

            filteredItems.forEach(({ row, originalIndex }) => {
                let tr = document.createElement('tr');
                tr.className = 'hover:bg-blue-50/40 transition';

                headers.forEach((_, colIndex) => {
                    let td = document.createElement('td');
                    td.className = 'px-6 py-4 whitespace-nowrap text-slate-700 text-xs sm:text-sm';
                    let cellVal = row[colIndex] !== undefined ? row[colIndex] : '';

                    if (colIndex === 3 && cellVal) {
                        let badgeClass = 'bg-slate-100 text-slate-700 border-slate-200';
                        if (cellVal.includes('분실')) {
                            badgeClass = 'bg-purple-50 text-purple-700 border-purple-200';
                        } else if (cellVal.includes('가능') || cellVal.includes('여유')) {
                            badgeClass = 'bg-emerald-50 text-emerald-700 border-emerald-200';
                        } else if (cellVal.includes('사용') || cellVal.includes('장착') || cellVal.includes('대여')) {
                            badgeClass = 'bg-amber-50 text-amber-700 border-amber-200';
                        } else if (cellVal.includes('불량') || cellVal.includes('점검')) {
                            badgeClass = 'bg-rose-50 text-rose-700 border-rose-200';
                        }
                        td.innerHTML = `<span class="px-2.5 py-1 rounded-lg text-xs font-medium border ${badgeClass} inline-flex items-center space-x-1"><span>${cellVal}</span></span>`;
                    } else {
                        td.innerText = cellVal;
                    }
                    tr.appendChild(td);
                });

                let actionTd = document.createElement('td');
                actionTd.className = 'px-6 py-4 whitespace-nowrap text-right text-xs font-medium space-x-2';
                actionTd.innerHTML = `
                    <button onclick="openEditModal(${originalIndex})" class="bg-blue-50 hover:bg-blue-100 text-blue-600 px-3 py-1.5 rounded-lg transition font-semibold inline-flex items-center space-x-1">
                        <i class="fa-solid fa-pen-to-square"></i>
                        <span>대여/반납</span>
                    </button>
                    <button onclick="deleteRow(${originalIndex})" class="text-slate-400 hover:text-rose-600 p-1.5 transition" title="삭제">
                        <i class="fa-solid fa-trash-can"></i>
                    </button>
                `;
                tr.appendChild(actionTd);
                bodyEl.appendChild(tr);
            });
        }

        window.openEditModal = function(index) {
            const row = allRows[index];
            document.getElementById('edit-row-id').value = index;
            document.getElementById('modal-item-info').value = `${row[0]} (${row[1]} / ${row[2]})`;
            document.getElementById('modal-status').value = row[3] || '사용가능';
            document.getElementById('modal-location').value = row[4] || '';
            document.getElementById('modal-manager').value = row[5] || '';
            
            let existingDate = row[6] || '';
            if (existingDate.includes(' ')) existingDate = existingDate.split(' ')[0];
            if (!existingDate) {
                const now = new Date();
                existingDate = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
            }
            document.getElementById('modal-date').value = existingDate;
            document.getElementById('action-modal').classList.remove('hidden');
        };

        window.closeModal = function() {
            document.getElementById('action-modal').classList.add('hidden');
        };

        window.onModalStatusChange = function() {
            const status = document.getElementById('modal-status').value;
            const managerInput = document.getElementById('modal-manager');
            if (status === '사용가능' && (managerInput.value === '' || managerInput.value === '-')) {
                managerInput.value = '-';
            }
            const now = new Date();
            const dateStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
            document.getElementById('modal-date').value = dateStr;
        };

        window.handleFormSubmit = function(event) {
            event.preventDefault();
            const index = parseInt(document.getElementById('edit-row-id').value);
            
            if (index >= 0 && index < allRows.length) {
                while(allRows[index].length < 7) allRows[index].push('');
                const cardId = allRows[index][0];
                const newStatus = document.getElementById('modal-status').value;
                const manager = document.getElementById('modal-manager').value;
                const dateStr = document.getElementById('modal-date').value;

                allRows[index][3] = newStatus;
                allRows[index][4] = document.getElementById('modal-location').value;
                allRows[index][5] = manager;
                allRows[index][6] = dateStr;

                addHistoryLog(cardId, newStatus, manager, dateStr);
                saveToFirebase();
                renderAll();
                closeModal();
            }
        };

        window.openAddModal = function() {
            document.getElementById('add-id').value = `SD-0${allRows.length + 1}`;
            document.getElementById('add-model').value = '';
            document.getElementById('add-capacity').value = '128GB';
            document.getElementById('add-location').value = '보관함 1번';
            document.getElementById('add-manager').value = '-';
            document.getElementById('add-modal').classList.remove('hidden');
        };

        window.closeAddModal = function() {
            document.getElementById('add-modal').classList.add('hidden');
        };

        window.handleAddNewCard = function(event) {
            event.preventDefault();
            const now = new Date();
            const dateStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;

            const newRow = [
                document.getElementById('add-id').value,
                document.getElementById('add-model').value,
                document.getElementById('add-capacity').value,
                document.getElementById('add-status').value,
                document.getElementById('add-location').value,
                document.getElementById('add-manager').value,
                dateStr
            ];

            allRows.unshift(newRow);
            saveToFirebase();
            renderAll();
            closeAddModal();
        };

        window.deleteRow = function(index) {
            if (confirm('정말 이 SD카드 자산을 장부에서 삭제하시겠습니까?')) {
                allRows.splice(index, 1);
                
                // 만약 모든 항목이 다 지워져서 비어버린 경우
                if (allRows.length === 0) {
                    // 파이어베이스가 null로 지워버리지 못하도록 빈 배열 대신 빈 상태 객체나 더미를 저장
                    set(ref(db, 'sd_card_ledger'), ["EMPTY_STATE"]);
                } else {
                    saveToFirebase();
                }
                renderAll();
            }
        };
    </script>
</body>
</html>
